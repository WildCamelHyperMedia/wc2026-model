name: Auto-update World Cup model

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min during the tournament
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update pipeline (fetch → calibrate → simulate → build)
        run: python update.py

      - name: Commit refreshed dashboard & data
        run: |
          git config user.name "wc2026-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || \
            (git commit -m "auto-update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
